spring.application.name=office-management

# ---- SQLite (single portable file) ----
# OFFICE_DB_PATH lets Docker point this at a host bind-mounted folder so the
# database survives container/volume cleanup. Defaults to ./data for local runs.
spring.datasource.url=jdbc:sqlite:${OFFICE_DB_PATH:./data/office.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite is a single-writer database; keep the pool tiny to avoid SQLITE_BUSY locks.
spring.datasource.hikari.maximum-pool-size=1

# ---- Hibernate / JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false

server.port=8080
