name: Build Windows MSI/EXE Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.2.0)"
        required: false
        default: "0.0.1"

jobs:
  build-windows-installers:
    name: Build ${{ matrix.installer_type }} (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        installer_type: [msi, exe]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: powershell
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tagVersion = "${{ github.ref }}".Replace("refs/tags/v", "")
            "version=$tagVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "version=${{ inputs.version }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Install WiX Toolset (required for msi/exe)
        shell: powershell
        run: |
          choco install wixtoolset --no-progress -y
          $wixBin = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3.*" |
            Sort-Object Name -Descending |
            Select-Object -First 1 |
            ForEach-Object { Join-Path $_.FullName "bin" }
          if (-not $wixBin -or -not (Test-Path $wixBin)) {
            throw "WiX Toolset bin directory was not found after installation."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin

      - name: Build native installer
        shell: powershell
        run: |
          .\build-installer.ps1 -Version "${{ steps.ver.outputs.version }}" -Type "${{ matrix.installer_type }}"

      - name: Locate installer artifact
        id: locate
        shell: powershell
        run: |
          $ext = if ("${{ matrix.installer_type }}" -eq "msi") { "*.msi" } else { "*.exe" }
          $artifact = Get-ChildItem -Path ".\installer" -Filter $ext -File | Select-Object -First 1
          if (-not $artifact) {
            throw "No ${{ matrix.installer_type }} file found in .\installer"
          }
          "artifact_path=$($artifact.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "artifact_name=$($artifact.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.artifact_name }}
          path: ${{ steps.locate.outputs.artifact_path }}
          retention-days: 7

      - name: Upload installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.artifact_path }}
