name: Build & Publish Native Installers

# Triggers on a version tag push  (e.g.  git tag v1.0.0 && git push origin v1.0.0)
# Also runnable manually from the Actions tab for testing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2.0)'
        required: false
        default: '0.0.1'

jobs:
  build:
    name: Build – ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            archive_cmd: zip
          - os: ubuntu-latest
            label: Linux
            archive_cmd: tar
          - os: macos-latest
            label: macOS
            archive_cmd: zip

    runs-on: ${{ matrix.os }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Resolve version ─────────────────────────────────────────────────────
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version || '0.0.1' }}" >> "$GITHUB_OUTPUT"
          fi

      # ── Node.js ─────────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── JDK 21 ──────────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # ── 1. Build Angular ─────────────────────────────────────────────────────
      - name: Build Angular frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ── 2. Copy dist → Spring Boot static resources ──────────────────────────
      - name: Copy Angular dist to backend
        shell: bash
        run: |
          rm -rf backend/src/main/resources/static
          mkdir -p backend/src/main/resources/static
          cp -r frontend/dist/frontend/browser/. backend/src/main/resources/static/

      # ── 3. Build Spring Boot JAR ─────────────────────────────────────────────
      - name: Build Spring Boot JAR
        working-directory: backend
        run: mvn -q -DskipTests package

      # ── 4. jpackage ──────────────────────────────────────────────────────────
      - name: Create app-image with jpackage
        shell: bash
        run: |
          mkdir -p installer
          ICON_ARG=""
          [[ -f "frontend/public/favicon.ico" ]] && ICON_ARG="--icon frontend/public/favicon.ico"
          jpackage \
            --input       backend/target \
            --name        "Office Management" \
            --main-jar    office-management.jar \
            --type        app-image \
            --app-version "${{ steps.ver.outputs.version }}" \
            --description "Personal office activity, todos and bookmarks tracker" \
            --dest        installer \
            $ICON_ARG

      # ── 5. Archive ────────────────────────────────────────────────────────────
      - name: Archive (Windows / macOS → zip)
        if: matrix.archive_cmd == 'zip'
        shell: bash
        run: |
          cd installer
          ASSET="office-management-${{ steps.ver.outputs.version }}-${{ matrix.label == 'Windows' && 'windows' || 'macos' }}.zip"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell -Command "Compress-Archive -Path 'Office Management' -DestinationPath '$ASSET'"
          else
            zip -r "$ASSET" "Office Management"
          fi
          echo "ASSET_PATH=installer/$ASSET" >> "$GITHUB_ENV"
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"

      - name: Archive (Linux → tar.gz)
        if: matrix.archive_cmd == 'tar'
        shell: bash
        run: |
          cd installer
          ASSET="office-management-${{ steps.ver.outputs.version }}-linux.tar.gz"
          tar -czf "$ASSET" "Office Management"
          echo "ASSET_PATH=installer/$ASSET" >> "$GITHUB_ENV"
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"

      # ── 6. Upload to GitHub Release ──────────────────────────────────────────
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Office Management v${{ steps.ver.outputs.version }}"
          generate_release_notes: true
          files: ${{ env.ASSET_PATH }}
          body: |
            ## ⬇️ Download for your platform

            | Platform | File |
            |----------|------|
            | 🪟 Windows | `office-management-${{ steps.ver.outputs.version }}-windows.zip` |
            | 🐧 Linux   | `office-management-${{ steps.ver.outputs.version }}-linux.tar.gz` |
            | 🍎 macOS   | `office-management-${{ steps.ver.outputs.version }}-macos.zip` |

            ### How to install
            1. Download the file for your platform from the **Assets** section below
            2. Extract the archive
            3. Run **`Office Management.exe`** (Windows) or **`Office Management`** (Linux/macOS)
            4. Your browser opens automatically at **http://localhost:8080**
            5. Use the **system-tray icon** to re-open or quit the app

            > ✅ No Java or Docker required — the runtime is bundled inside.
            > 💾 Your data is saved to `~/.office-management/office.db`

      # Upload as a workflow artifact when triggered manually (no tag = no release)
      - name: Upload artifact (manual run only)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_PATH }}
          retention-days: 7
