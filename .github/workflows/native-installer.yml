name: Build & Publish Native Installers

# Triggers on a version tag push  (e.g.  git tag v1.0.0 && git push origin v1.0.0)
# Also runnable manually from the Actions tab for testing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2.0)'
        required: false
        default: '0.0.1'

jobs:
  build:
    name: Build – ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            archive_cmd: zip
          - os: ubuntu-latest
            label: Linux
            archive_cmd: tar
          # macOS build temporarily disabled
          # - os: macos-latest
          #   label: macOS
          #   archive_cmd: zip

    runs-on: ${{ matrix.os }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Resolve version ─────────────────────────────────────────────────────
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version || '0.0.1' }}" >> "$GITHUB_OUTPUT"
          fi

      # ── Node.js ─────────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── JDK 21 ──────────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # ── 1. Build Angular ─────────────────────────────────────────────────────
      - name: Build Angular frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ── 2. Copy dist → Spring Boot static resources ──────────────────────────
      - name: Copy Angular dist to backend
        shell: bash
        run: |
          rm -rf backend/src/main/resources/static
          mkdir -p backend/src/main/resources/static
          cp -r frontend/dist/frontend/browser/. backend/src/main/resources/static/

      # ── 3. Build Spring Boot JAR ─────────────────────────────────────────────
      - name: Build Spring Boot JAR
        working-directory: backend
        run: mvn -q -DskipTests package

      # ── 4. Bundle: JRE (jlink) + JAR + launcher script ───────────────────────
      - name: Create application bundle
        shell: bash
        run: |
          APP_DIR="installer/Office Management"
          mkdir -p "$APP_DIR/app"
          mkdir -p "$APP_DIR/runtime"

          # Copy ONLY the fat jar into a clean input folder
          cp backend/target/office-management.jar "$APP_DIR/app/office-management.jar"

          # Build a self-contained JRE with jlink (all modules)
          jlink \
            --add-modules ALL-MODULE-PATH \
            --output "$APP_DIR/runtime" \
            --strip-debug \
            --no-header-files \
            --no-man-pages

          # Windows launcher batch script
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cat > "$APP_DIR/Start Office Management.bat" << 'WINEOF'
@echo off
title Office Management
set "SCRIPT=%~dp0"
start "" "%SCRIPT%runtime\bin\javaw.exe" ^
  -Xms64m -Xmx512m ^
  -jar "%SCRIPT%app\office-management.jar"
WINEOF
          fi

          # Linux launcher shell script
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cat > "$APP_DIR/start.sh" << 'LINEOF'
#!/usr/bin/env bash
SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
"$SCRIPT_DIR/runtime/bin/java" \
  -Xms64m -Xmx512m \
  -jar "$SCRIPT_DIR/app/office-management.jar"
LINEOF
            chmod +x "$APP_DIR/start.sh"
          fi

          # Readme
          cat > "$APP_DIR/README.txt" << 'README'
Office Management – Quick Start
================================
Windows : Double-click  "Start Office Management.bat"
Linux   : Run           ./start.sh

Your browser will open at http://localhost:8080
Your data is stored at:  ~/.office-management/office.db
README

      # ── 5. Archive ────────────────────────────────────────────────────────────
      - name: Archive (Windows → zip)
        if: matrix.label == 'Windows'
        shell: bash
        run: |
          ASSET="office-management-${{ steps.ver.outputs.version }}-windows.zip"
          powershell -Command "Compress-Archive -Path 'installer\\Office Management' -DestinationPath '$ASSET'"
          echo "ASSET_PATH=$ASSET" >> "$GITHUB_ENV"
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"

      - name: Archive (Linux → tar.gz)
        if: matrix.label == 'Linux'
        shell: bash
        run: |
          ASSET="office-management-${{ steps.ver.outputs.version }}-linux.tar.gz"
          tar -czf "$ASSET" -C installer "Office Management"
          echo "ASSET_PATH=$ASSET" >> "$GITHUB_ENV"
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"

      # ── 6. Upload to GitHub Release ──────────────────────────────────────────
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Office Management v${{ steps.ver.outputs.version }}"
          generate_release_notes: true
          files: ${{ env.ASSET_PATH }}
          body: |
            ## ⬇️ Download for your platform

            | Platform | File |
            |----------|------|
            | 🪟 Windows | `office-management-${{ steps.ver.outputs.version }}-windows.zip` |
            | 🐧 Linux   | `office-management-${{ steps.ver.outputs.version }}-linux.tar.gz` |
            | 🍎 macOS   | `office-management-${{ steps.ver.outputs.version }}-macos.zip` |

            ### How to install
            1. Download the file for your platform from the **Assets** section below
            2. Extract the archive
            3. **Windows**: Double-click **`Start Office Management.bat`**
            4. **Linux**: Run **`./start.sh`** in terminal
            5. Your browser opens automatically at **http://localhost:8080**

            > ✅ No Java or Docker required — the runtime is bundled inside.
            > 💾 Your data is saved to `~/.office-management/office.db`

      # Upload as a workflow artifact when triggered manually (no tag = no release)
      - name: Upload artifact (manual run only)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_PATH }}
          retention-days: 7
