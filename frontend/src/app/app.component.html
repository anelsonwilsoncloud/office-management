<app-setup-dialog
  *ngIf="showSetup"
  [defaultDbPath]="setupDbPath"
  [initialFileBrowser]="setupFileBrowser"
  (setupComplete)="onSetupComplete()">
</app-setup-dialog>

<header class="app-header">
  <div class="header-left">
    <h1>Office Management</h1>
    <p class="tagline">Track your bookmarks, todos &amp; more &mdash; fast search, more productivity.</p>
  </div>
  <button class="settings-btn" (click)="openSettings()" title="Database Settings">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33
               1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33
               l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4
               h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06
               A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51
               a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9
               a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
    Settings
  </button>
</header>

<nav class="tabs">
  <button type="button" [class.active]="activeTab === 'bookmarks'" (click)="select('bookmarks')">
    Bookmark Search
  </button>
  <button type="button" [class.active]="activeTab === 'todos'" (click)="select('todos')">
    Todos
  </button>
  <button type="button" [class.active]="activeTab === 'activities'" (click)="select('activities')">
    Daily Activities
  </button>
  <button type="button" [class.active]="activeTab === 'learning'" (click)="select('learning')">
    Technical Learning
  </button>
</nav>

<main class="content">
  <app-bookmarks *ngIf="activeTab === 'bookmarks'"></app-bookmarks>
  <app-todos *ngIf="activeTab === 'todos'"></app-todos>
  <app-daily-activities *ngIf="activeTab === 'activities'"></app-daily-activities>
  <app-technical-learning *ngIf="activeTab === 'learning'"></app-technical-learning>
</main>

<footer class="app-footer">
  Built by Nelson &copy; 2026. All rights reserved.
</footer>
