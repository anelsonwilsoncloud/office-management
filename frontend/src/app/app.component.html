<header class="app-header">
  <h1>Office Management</h1>
  <p class="tagline">Track your bookmarks &amp; todos &mdash; fast search, more productivity.</p>
</header>

<nav class="tabs">
  <button type="button" [class.active]="activeTab === 'bookmarks'" (click)="select('bookmarks')">
    Bookmark Search
  </button>
  <button type="button" [class.active]="activeTab === 'todos'" (click)="select('todos')">
    Todos
  </button>
  <button type="button" [class.active]="activeTab === 'activities'" (click)="select('activities')">
    Daily Activities
  </button>
</nav>

<main class="content">
  <app-bookmarks *ngIf="activeTab === 'bookmarks'"></app-bookmarks>
  <app-todos *ngIf="activeTab === 'todos'"></app-todos>
  <app-daily-activities *ngIf="activeTab === 'activities'"></app-daily-activities>
</main>

<footer class="app-footer">
  Built by Nelson &copy; 2026. All rights reserved.
</footer>
